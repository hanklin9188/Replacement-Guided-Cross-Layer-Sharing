[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replacement-guided-sharing"
version = "0.1.0"
description = "Reference implementation for replacement-guided cross-layer FFN sharing"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2,<2",
  "datasets>=3.2,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "peft>=0.14,<1",
  "pyarrow>=15,<22",
  "pyyaml>=6,<7",
  "safetensors>=0.4.5,<1",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "seaborn>=0.13,<1",
  "torch==2.6.0",
  "transformers>=4.48,<5",
]

[project.scripts]
rgcls = "icassp27.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
